<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>User sign-in | RemoteSignLab</title>
  <link rel="stylesheet" href="/ui/static/styles.css">
  <link rel="stylesheet" href="/user/static/user.css">
  <script src="/user/static/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand" aria-label="RemoteSignLab">
        <span class="brand-mark" aria-hidden="true">RL</span>
        <span>
          <strong>RemoteSignLab</strong>
          <small>User area</small>
        </span>
      </div>

      <div class="login-heading">
        <p class="eyebrow">Remote signing</p>
        <h1 id="login-title">Sign in</h1>
        <p>Review your documents and give your consent before strong authentication.</p>
      </div>

      <div id="login-feedback" class="alert alert-error" role="alert" aria-live="assertive" hidden></div>

      <form class="login-form" action="/user/login" method="post">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username" maxlength="320" required autofocus>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        </div>

        <button class="button button-primary button-wide" type="submit">Open my account</button>
      </form>

      <p class="login-footnote">This access is separate from the administrator interface.</p>
    </section>
  </main>
</body>
</html>
