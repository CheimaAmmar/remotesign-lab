<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Connexion utilisateur | Stage-HSM</title>
  <link rel="stylesheet" href="/ui/static/styles.css">
  <link rel="stylesheet" href="/user/static/user.css">
  <script src="/user/static/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand" aria-label="Stage-HSM">
        <span class="brand-mark" aria-hidden="true">SH</span>
        <span>
          <strong>Stage-HSM</strong>
          <small>Espace utilisateur</small>
        </span>
      </div>

      <div class="login-heading">
        <p class="eyebrow">Signature distante</p>
        <h1 id="login-title">Se connecter</h1>
        <p>Consultez vos documents et donnez votre consentement avant l’authentification forte.</p>
      </div>

      <div id="login-feedback" class="alert alert-error" role="alert" aria-live="assertive" hidden></div>

      <form class="login-form" action="/user/login" method="post">
        <div class="field">
          <label for="email">Adresse e-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" maxlength="320" required autofocus>
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        </div>

        <button class="button button-primary button-wide" type="submit">Ouvrir mon espace</button>
      </form>

      <p class="login-footnote">Cet accès est distinct de l’interface administrateur.</p>
    </section>
  </main>
</body>
</html>
