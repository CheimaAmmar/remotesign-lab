<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Sign in | RemoteSignLab</title>
  <link rel="stylesheet" href="/ui/static/styles.css">
  <script src="/ui/static/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand" aria-label="RemoteSignLab">
        <span class="brand-mark" aria-hidden="true">RL</span>
        <span>
          <strong>RemoteSignLab</strong>
          <small>Local prototype</small>
        </span>
      </div>

      <div class="login-heading">
        <p class="eyebrow">Protected access</p>
        <h1 id="login-title">Open the interface</h1>
        <p>Authenticate this session before uploading a document.</p>
      </div>

      <div id="login-feedback" class="alert alert-error" role="alert" aria-live="assertive" hidden></div>

      <form class="login-form" action="/ui/login" method="post">
        <div class="field">
          <label for="admin-key">Administrator access key</label>
          <input
            id="admin-key"
            name="admin_key"
            type="password"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            required
            autofocus
          >
          <p class="field-hint">The key is sent to the server over the HTTPS connection and is not stored by this page.</p>
        </div>

        <button class="button button-primary button-wide" type="submit">Sign in</button>
      </form>

      <p class="login-footnote">The interface uses a time-limited local session.</p>
    </section>
  </main>
</body>
</html>
